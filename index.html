<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/favicon.ico" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900,500,400&f[]=jetbrains-mono@400,700&display=swap" rel="stylesheet" />
    <!-- LCP: la primera imagen del carrusel del landing y el logo del header
         son candidatos a LCP descubiertos tarde (llegan con el render de
         React). El preload los arranca en el parse del HTML, en paralelo al
         JS, con prioridad alta para ganar la contienda del arranque.
         imagesrcset/imagesizes: el preload participa de la MISMA selección
         responsive que el <img> — en móvil baja el candidato 768w (~20 kB
         AVIF) en vez del 1536w (~64 kB). -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      imagesrcset="/branding/carrusel/disuasion-768.avif 768w, /branding/carrusel/disuasion-1536.avif 1536w"
      imagesizes="(min-width: 1280px) 768px, 90vw"
    />
    <link rel="preload" as="image" fetchpriority="high" href="/branding/logo-alerta-dealers.png" />
    <title>Alerta Dealers — Red Privada entre Automotoras</title>
    <meta name="description" content="La única red de seguridad para automotoras en Chile. Alertas en tiempo real, botón de pánico con GPS y telemetría para la Región de Coquimbo." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
